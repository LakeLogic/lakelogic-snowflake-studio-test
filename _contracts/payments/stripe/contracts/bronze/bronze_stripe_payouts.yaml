version: 1.0.0

info:
  title: Bronze — Stripe Payouts
  target_layer: bronze
  table_name: '{bronze_layer}_stripe_payouts'
  domain: payments
  system: stripe

model:
  fields:
  - name: payout_id
    type: string
    description: Observed string column ingested from the scanned source payments.stripe.payouts.
  - name: driver_id
    type: string
    description: Observed string column ingested from the scanned source payments.stripe.payouts.
  - name: amount
    type: float
    description: Observed float column ingested from the scanned source payments.stripe.payouts.
  - name: currency
    type: string
    description: Observed string column ingested from the scanned source payments.stripe.payouts.
  - name: status
    type: string
    description: Observed string column ingested from the scanned source payments.stripe.payouts.
  - name: payout_email
    type: string
    pii: true
    classification: email
    description: Observed string column ingested from the scanned source payments.stripe.payouts.
      Personal data (email), not masked.
  - name: bank_account_last_four
    type: string
    sensitive: true
    classification: financial_account
    description: Observed string column ingested from the scanned source payments.stripe.payouts.
      Confidential (financial_account), not masked.
  - name: arrival_date
    type: date
    description: Observed date column ingested from the scanned source payments.stripe.payouts.
  - name: created_at
    type: timestamp
    description: Observed timestamp column ingested from the scanned source payments.stripe.payouts.

source:
  type: landing
  path: '{landing_root}/payouts'
  format: parquet
  load_mode: full

dataset: bronze_stripe_payouts
