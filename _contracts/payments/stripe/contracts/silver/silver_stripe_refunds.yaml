version: 1.0.0

info:
  title: Silver — Stripe Refunds
  target_layer: silver
  table_name: '{silver_layer}_stripe_refunds'
  system: stripe
  domain: payments

model:
  fields:
  - name: refund_id
    type: string
    required: true
    description: Business key 'refund_id' (from source table 'refunds'), typed as
      string.
  - name: charge_id
    type: string
    required: true
    description: Column 'charge_id' projected from source table 'refunds', typed as
      string.
  - name: rider_id
    type: string
    required: true
    description: Column 'rider_id' projected from source table 'refunds', typed as
      string.
  - name: amount
    type: float
    required: false
    description: Column 'amount' projected from source table 'refunds', typed as float.
  - name: currency
    type: string
    required: false
    description: Column 'currency' projected from source table 'refunds', typed as
      string.
  - name: status
    type: string
    required: false
    description: Column 'status' projected from source table 'refunds', typed as string.
  - name: reason
    type: string
    required: false
    description: Column 'reason' projected from source table 'refunds', typed as string.
  - name: refund_reason
    type: string
    required: false
    description: Column 'refund_reason' projected from source table 'refunds', typed
      as string.
  - name: created_at
    type: timestamp
    required: false
    description: Column 'created_at' projected from source table 'refunds', typed
      as timestamp.
  - name: created_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `created_at`.'

primary_key:
- refund_id

quality:
  row_rules:
  - name: refund_id_not_null
    sql: refund_id IS NOT NULL
    category: completeness
    description: refund_id is always present (never null).
  - name: charge_id_not_null
    sql: charge_id IS NOT NULL
    category: completeness
    description: charge_id is always present (never null).
  - name: rider_id_not_null
    sql: rider_id IS NOT NULL
    category: completeness
    description: rider_id is always present (never null).
  - name: refund_id_not_null
    sql: refund_id IS NOT NULL
    category: completeness
    description: refund_id is always present (never null).

transformations:
- phase: pre
  derive:
    field: created_date
    sql: CAST(created_at AS DATE)
- deduplicate:
    by:
    - refund_id
    sort_by:
    - created_at
    order: desc

materialization:
  partition_by:
  - created_date

dataset: silver_stripe_refunds

source:
  type: table
  path: table:{bronze_root}.{bronze_layer}_stripe_refunds
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
