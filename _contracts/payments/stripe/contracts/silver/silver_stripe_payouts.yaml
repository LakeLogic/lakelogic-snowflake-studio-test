version: 1.0.0

info:
  title: Silver — Stripe Payouts
  target_layer: silver
  table_name: '{silver_layer}_stripe_payouts'
  system: stripe
  domain: payments

model:
  fields:
  - name: payout_id
    type: string
    required: true
    description: Business key 'payout_id' (from source table 'payouts'), typed as
      string.
  - name: driver_id
    type: string
    required: true
    description: Column 'driver_id' projected from source table 'payouts', typed as
      string.
  - name: amount
    type: float
    required: false
    description: Column 'amount' projected from source table 'payouts', typed as float.
  - name: currency
    type: string
    required: false
    description: Column 'currency' projected from source table 'payouts', typed as
      string.
  - name: status
    type: string
    required: false
    description: Column 'status' projected from source table 'payouts', typed as string.
  - name: payout_email
    type: string
    required: false
    pii: true
    classification: email
    description: Column 'payout_email' projected from source table 'payouts', typed
      as string. Personal data (email), real values here, masked at gold (hash).
  - name: bank_account_last_four
    type: string
    required: false
    sensitive: true
    classification: financial_account
    description: Column 'bank_account_last_four' projected from source table 'payouts',
      typed as string. Confidential (financial_account), real values here, masked
      at gold (hash).
  - name: arrival_date
    type: date
    required: false
    description: Column 'arrival_date' projected from source table 'payouts', typed
      as date.
  - name: created_at
    type: timestamp
    required: false
    description: Column 'created_at' projected from source table 'payouts', typed
      as timestamp.
  - name: created_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `created_at`.'

primary_key:
- payout_id

quality:
  row_rules:
  - name: payout_id_not_null
    sql: payout_id IS NOT NULL
    category: completeness
    description: payout_id is always present (never null).
  - name: driver_id_not_null
    sql: driver_id IS NOT NULL
    category: completeness
    description: driver_id is always present (never null).
  - name: payout_id_not_null
    sql: payout_id IS NOT NULL
    category: completeness
    description: payout_id is always present (never null).

transformations:
- phase: pre
  derive:
    field: created_date
    sql: CAST(created_at AS DATE)
- deduplicate:
    by:
    - payout_id
    sort_by:
    - arrival_date
    order: desc

materialization:
  partition_by:
  - created_date

dataset: silver_stripe_payouts

source:
  type: table
  path: table:{bronze_root}.{bronze_layer}_stripe_payouts
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
