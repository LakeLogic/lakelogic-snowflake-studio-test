version: 1.0.0

info:
  title: Bronze — Rideflow Rider Profiles
  target_layer: bronze
  table_name: '{bronze_layer}_rideflow_rider_profiles'
  domain: marketplace
  system: rideflow

model:
  fields:
  - name: rider_id
    type: string
    description: Observed string column ingested from the scanned source marketplace.rideflow.rider_profiles.
  - name: name
    type: string
    pii: true
    classification: person_name
    description: Observed string column ingested from the scanned source marketplace.rideflow.rider_profiles.
      Personal data (person_name), not masked.
  - name: email
    type: string
    pii: true
    classification: email
    description: Observed string column ingested from the scanned source marketplace.rideflow.rider_profiles.
      Personal data (email), not masked.
  - name: phone
    type: string
    pii: true
    classification: phone
    description: Observed string column ingested from the scanned source marketplace.rideflow.rider_profiles.
      Personal data (phone), not masked.
  - name: date_of_birth
    type: string
    pii: true
    classification: date_of_birth
    description: Observed string column ingested from the scanned source marketplace.rideflow.rider_profiles.
      Personal data (date_of_birth), not masked.
  - name: home_address
    type: string
    pii: true
    classification: postal_address
    description: Observed string column ingested from the scanned source marketplace.rideflow.rider_profiles.
      Personal data (postal_address), not masked.
  - name: city_code
    type: string
    description: Observed string column ingested from the scanned source marketplace.rideflow.rider_profiles.
  - name: country_code
    type: string
    description: Observed string column ingested from the scanned source marketplace.rideflow.rider_profiles.
  - name: signup_date
    type: date
    description: Observed date column ingested from the scanned source marketplace.rideflow.rider_profiles.
  - name: status
    type: string
    description: Observed string column ingested from the scanned source marketplace.rideflow.rider_profiles.
  - name: preferred_payment_method
    type: string
    description: Observed string column ingested from the scanned source marketplace.rideflow.rider_profiles.
  - name: updated_at
    type: timestamp
    description: Observed timestamp column ingested from the scanned source marketplace.rideflow.rider_profiles.

source:
  type: landing
  path: '{landing_root}/rider_profiles'
  format: parquet
  load_mode: full

quality:
  row_rules:
  - name: country_code_partition_not_null
    sql: country_code IS NOT NULL
    category: completeness
    description: country_code is always present (never null).

materialization:
  partition_by:
  - country_code

dataset: bronze_rideflow_rider_profiles
