version: 1.0.0

info:
  title: Silver — Rideflow Rider App Events
  target_layer: silver
  table_name: '{silver_layer}_rideflow_rider_app_events'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: event_id
    type: string
    required: true
    description: Business key 'event_id' (from source table 'rider_app_events'), typed
      as string.
  - name: rider_id
    type: string
    required: true
    description: Column 'rider_id' projected from source table 'rider_app_events',
      typed as string.
  - name: device_id
    type: string
    required: true
    pii: true
    classification: device_id
    description: Column 'device_id' projected from source table 'rider_app_events',
      typed as string. Personal data (device_id), real values here, masked at gold
      (hash).
  - name: ip_address
    type: string
    required: false
    pii: true
    classification: ip_address
    description: Column 'ip_address' projected from source table 'rider_app_events',
      typed as string. Personal data (ip_address), real values here, masked at gold
      (redact).
  - name: event_name
    type: string
    required: false
    description: Column 'event_name' projected from source table 'rider_app_events',
      typed as string.
  - name: screen_name
    type: string
    required: false
    description: Column 'screen_name' projected from source table 'rider_app_events',
      typed as string.
  - name: event_timestamp
    type: timestamp
    required: false
    description: Column 'event_timestamp' projected from source table 'rider_app_events',
      typed as timestamp.
  - name: app_version
    type: string
    required: false
    description: Column 'app_version' projected from source table 'rider_app_events',
      typed as string.
  - name: platform
    type: string
    required: false
    description: Column 'platform' projected from source table 'rider_app_events',
      typed as string.
  - name: city_code
    type: string
    required: false
    description: Column 'city_code' projected from source table 'rider_app_events',
      typed as string.
  - name: country_code
    type: string
    required: false
    description: Column 'country_code' projected from source table 'rider_app_events',
      typed as string.
  - name: event_properties_json
    type: string
    required: false
    description: Column 'event_properties_json' projected from source table 'rider_app_events',
      typed as string.
  - name: event_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `event_timestamp`.'

primary_key:
- event_id

quality:
  row_rules:
  - name: event_id_not_null
    sql: event_id IS NOT NULL
    category: completeness
    description: event_id is always present (never null).
  - name: rider_id_not_null
    sql: rider_id IS NOT NULL
    category: completeness
    description: rider_id is always present (never null).
  - name: device_id_not_null
    sql: device_id IS NOT NULL
    category: completeness
    description: device_id is always present (never null).
  - name: event_id_not_null
    sql: event_id IS NOT NULL
    category: completeness
    description: event_id is always present (never null).

transformations:
- phase: pre
  derive:
    field: event_date
    sql: CAST(event_timestamp AS DATE)
- deduplicate:
    by:
    - event_id
    sort_by:
    - event_timestamp
    order: desc

materialization:
  partition_by:
  - country_code
  - event_date

dataset: silver_rideflow_rider_app_events

source:
  type: table
  path: table:{bronze_root}.{bronze_layer}_rideflow_rider_app_events
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
