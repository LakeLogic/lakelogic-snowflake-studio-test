version: 1.0.0

info:
  title: Gold — Dim Driver Profiles
  target_layer: gold
  description: 'grain: one row per driver'
  table_name: '{gold_layer}_dim_driver_profiles'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: driver_profiles_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: driver_id
    type: string
    required: true
    description: Dimension attribute 'driver_id', projected from the 'driver_profiles'
      entity.
  - name: bank_account_last_four
    type: string
    required: false
    sensitive: true
    masking: hash
    classification: financial_account
    description: Dimension attribute 'bank_account_last_four', projected from the
      'driver_profiles' entity. Confidential (financial_account), masked (hash).
  - name: city_code
    type: string
    required: false
    description: Dimension attribute 'city_code', projected from the 'driver_profiles'
      entity.
  - name: country_code
    type: string
    required: false
    description: Dimension attribute 'country_code', projected from the 'driver_profiles'
      entity.
  - name: licence_number
    type: string
    required: false
    pii: true
    masking: hash
    classification: licence_id
    description: Dimension attribute 'licence_number', projected from the 'driver_profiles'
      entity. Personal data (licence_id), masked (hash).
  - name: licence_plate
    type: string
    required: false
    pii: true
    masking: hash
    classification: licence_plate
    description: Dimension attribute 'licence_plate', projected from the 'driver_profiles'
      entity. Personal data (licence_plate), masked (hash).
  - name: rating
    type: float
    required: false
    description: Dimension attribute 'rating', projected from the 'driver_profiles'
      entity.
  - name: signup_date
    type: date
    required: false
    description: Dimension attribute 'signup_date', projected from the 'driver_profiles'
      entity.
  - name: status
    type: string
    required: false
    description: Dimension attribute 'status', projected from the 'driver_profiles'
      entity.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_driver_profiles

primary_key:
- driver_id

materialization:
  scd1:
    surrogate_key: driver_profiles_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

source:
  type: table
  path: table:{silver_root}.{silver_layer}_rideflow_driver_profiles
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'

transformations:
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''
