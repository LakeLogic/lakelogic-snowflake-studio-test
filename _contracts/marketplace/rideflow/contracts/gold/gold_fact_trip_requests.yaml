version: 1.0.0

info:
  title: Gold — Fact Trip Requests
  target_layer: gold
  description: 'grain: one row per trip request'
  table_name: '{gold_layer}_fact_trip_requests'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: request_id
    type: string
    required: true
    description: Grain key of the 'trip_requests' fact.
  - name: estimated_fare
    type: float
    required: false
    description: 'Measure candidate: sum of ''estimated_fare'' (needs confirmation).'
  - name: estimated_eta_minutes
    type: float
    required: false
    description: 'Measure candidate: avg of ''estimated_eta_minutes'' (needs confirmation).'
  - name: surge_multiplier
    type: float
    required: false
    description: 'Measure candidate: avg of ''surge_multiplier'' (needs confirmation).'
  - name: requested_at
    type: timestamp
    required: false
    description: Column 'requested_at' of the 'trip_requests' fact.
  - name: city_code
    type: string
    required: false
    description: Column 'city_code' of the 'trip_requests' fact.
  - name: rider_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_rider_profiles
      column: rider_profiles_sk
    description: Surrogate key of gold_dim_rider_profiles, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: city_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_cities
      column: cities_sk
    description: Surrogate key of gold_dim_cities, looked up on its business key;
      '-1' when the dimension does not know the row.
  - name: requested_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `requested_at`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_trip_requests

primary_key:
- request_id

quality:
  dataset_rules:
  - unique:
      columns:
      - request_id
      name: request_id_unique
      category: uniqueness
      description: No two rows share the same request_id.
  - name: rider_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE rider_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose rider_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: city_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE city_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose city_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.request_id,
      r.requested_at,
      r.city_code,
      r.estimated_fare AS estimated_fare,
      r.estimated_eta_minutes AS estimated_eta_minutes,
      r.surge_multiplier AS surge_multiplier,
      COALESCE(d1.rider_profiles_sk, '-1') AS rider_sk,
      COALESCE(d2.cities_sk, '-1') AS city_sk,
      CAST(r.requested_at AS DATE) AS requested_date
    FROM source r
    LEFT JOIN gold_dim_rider_profiles d1
      ON  r.rider_id = d1.rider_id
    LEFT JOIN gold_dim_cities d2
      ON  r.city_code = d2.city_code
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''

links:
- name: gold_dim_rider_profiles
  type: table
  path: table:{gold_root}.{gold_layer}_dim_rider_profiles
- name: gold_dim_cities
  type: table
  path: table:{domain_catalog_prefix}_reference.{gold_layer}.{gold_layer}_dim_cities

upstream:
- gold_dim_cities
- gold_dim_rider_profiles

materialization:
  strategy: append
  fact:
    type: transaction
  partition_by:
  - requested_date

source:
  type: table
  path: table:{silver_root}.{silver_layer}_rideflow_trip_requests
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
