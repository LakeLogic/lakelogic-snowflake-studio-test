version: 1.0.0

info:
  title: Silver — Internal Fx Rates Daily
  target_layer: silver
  table_name: '{silver_layer}_internal_fx_rates_daily'
  system: internal
  domain: reference

model:
  fields:
  - name: rate_date
    type: date
    required: true
    description: Business key 'rate_date' (from source table 'fx_rates_daily'), typed
      as date.
  - name: base_currency
    type: string
    required: true
    description: Business key 'base_currency' (from source table 'fx_rates_daily'),
      typed as string.
  - name: quote_currency
    type: string
    required: true
    description: Business key 'quote_currency' (from source table 'fx_rates_daily'),
      typed as string.
  - name: rate
    type: float
    required: false
    description: Column 'rate' projected from source table 'fx_rates_daily', typed
      as float.
  - name: source_feed
    type: string
    required: false
    description: Column 'source_feed' projected from source table 'fx_rates_daily',
      typed as string.

primary_key:
- rate_date
- base_currency
- quote_currency

quality:
  row_rules:
  - name: rate_date_not_null
    sql: rate_date IS NOT NULL
    category: completeness
    description: rate_date is always present (never null).
  - name: rate_date_not_null
    sql: rate_date IS NOT NULL
    category: completeness
    description: rate_date is always present (never null).
  - name: base_currency_not_null
    sql: base_currency IS NOT NULL
    category: completeness
    description: base_currency is always present (never null).
  - name: quote_currency_not_null
    sql: quote_currency IS NOT NULL
    category: completeness
    description: quote_currency is always present (never null).

dataset: silver_internal_fx_rates_daily

source:
  type: table
  path: table:{bronze_root}.{bronze_layer}_internal_fx_rates_daily
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'

transformations:
- deduplicate:
    by:
    - rate_date
    - base_currency
    - quote_currency
    sort_by:
    - _lakelogic_processed_at
    order: desc
