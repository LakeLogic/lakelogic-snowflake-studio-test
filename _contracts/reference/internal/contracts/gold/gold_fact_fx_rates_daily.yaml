version: 1.0.0

info:
  title: Gold — Fact Fx Rates Daily
  target_layer: gold
  description: 'grain: one row per day and currency pair'
  table_name: '{gold_layer}_fact_fx_rates_daily'
  system: internal
  domain: reference

model:
  fields:
  - name: rate_date
    type: date
    required: true
    description: Grain key of the 'fx_rates_daily' fact.
  - name: base_currency
    type: string
    required: true
    description: Grain key of the 'fx_rates_daily' fact.
  - name: quote_currency
    type: string
    required: true
    description: Grain key of the 'fx_rates_daily' fact.
  - name: rate
    type: float
    required: false
    description: 'Measure candidate: avg of ''rate'' (needs confirmation).'
  - name: source_feed
    type: string
    required: false
    description: Column 'source_feed' of the 'fx_rates_daily' fact.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_fx_rates_daily

primary_key:
- rate_date
- base_currency
- quote_currency

quality:
  dataset_rules:
  - unique:
      columns:
      - rate_date
      - base_currency
      - quote_currency
      name: rate_date_base_currency_quote_currency_unique
      category: uniqueness
      description: No two rows share the same rate_date, base_currency, quote_currency.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.rate_date,
      r.base_currency,
      r.quote_currency,
      r.source_feed,
      r.rate AS rate
    FROM source r
- phase: pre
  derive:
    field: system
    sql: '''internal'''

materialization:
  strategy: append
  fact:
    type: transaction

source:
  type: table
  path: table:{silver_root}.{silver_layer}_internal_fx_rates_daily
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
