version: 1.0.0

info:
  title: Bronze — Internal Cities
  target_layer: bronze
  table_name: '{bronze_layer}_internal_cities'
  domain: reference
  system: internal

model:
  fields:
  - name: city_code
    type: string
    description: Observed string column ingested from the scanned source reference.internal.cities.
  - name: city_name
    type: string
    description: Observed string column ingested from the scanned source reference.internal.cities.
  - name: country_code
    type: string
    description: Observed string column ingested from the scanned source reference.internal.cities.
  - name: timezone
    type: string
    description: Observed string column ingested from the scanned source reference.internal.cities.
  - name: default_currency
    type: string
    description: Observed string column ingested from the scanned source reference.internal.cities.
  - name: geofence_wkt
    type: string
    description: Observed string column ingested from the scanned source reference.internal.cities.
  - name: launched_at
    type: timestamp
    description: Observed timestamp column ingested from the scanned source reference.internal.cities.
  - name: sunset_at
    type: timestamp
    description: Observed timestamp column ingested from the scanned source reference.internal.cities.
  - name: is_active
    type: boolean
    description: Observed boolean column ingested from the scanned source reference.internal.cities.

source:
  type: landing
  path: '{landing_root}/cities'
  format: parquet
  load_mode: full

primary_key:
- city_code

quality:
  row_rules:
  - name: country_code_partition_not_null
    sql: country_code IS NOT NULL
    category: completeness
    description: country_code is always present (never null).

materialization:
  partition_by:
  - country_code

dataset: bronze_internal_cities
