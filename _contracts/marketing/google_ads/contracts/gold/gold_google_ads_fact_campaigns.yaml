version: 1.0.0

info:
  title: Gold — Fact Campaigns (Google Ads)
  target_layer: gold
  description: 'grain: one row per campaign, ad group/ad set and day'
  table_name: '{gold_layer}_google_ads_fact_campaigns'
  system: google_ads
  domain: marketing

model:
  fields:
  - name: campaign_id
    type: string
    required: true
    description: Grain key of the 'campaigns' fact.
  - name: ad_group_id
    type: string
    required: true
    description: Grain key of the 'campaigns' fact.
  - name: date
    type: date
    required: true
    description: Grain key of the 'campaigns' fact.
  - name: total_impressions
    type: integer
    required: false
    description: Column 'total_impressions' of the 'campaigns' fact.
  - name: total_clicks
    type: integer
    required: false
    description: Column 'total_clicks' of the 'campaigns' fact.
  - name: total_conversions
    type: integer
    required: false
    description: Column 'total_conversions' of the 'campaigns' fact.
  - name: total_cost
    type: float
    required: false
    description: Column 'total_cost' of the 'campaigns' fact.
  - name: campaign_name
    type: string
    required: false
    description: Column 'campaign_name' of the 'campaigns' fact.
  - name: currency
    type: string
    required: false
    description: Column 'currency' of the 'campaigns' fact.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_google_ads_fact_campaigns

primary_key:
- campaign_id
- ad_group_id
- date

quality:
  dataset_rules:
  - unique:
      columns:
      - campaign_id
      - ad_group_id
      - date
      name: campaign_id_ad_group_id_date_unique
      category: uniqueness
      description: No two rows share the same campaign_id, ad_group_id, date.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.campaign_id,
      r.ad_group_id,
      r.date,
      r.campaign_name,
      r.currency,
      r.impressions AS total_impressions,
      r.clicks AS total_clicks,
      r.conversions AS total_conversions,
      r.cost AS total_cost
    FROM source r
- phase: pre
  derive:
    field: system
    sql: '''google_ads'''

materialization:
  strategy: append
  fact:
    type: transaction

source:
  type: table
  path: table:{silver_root}.{silver_layer}_google_ads_campaigns
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
