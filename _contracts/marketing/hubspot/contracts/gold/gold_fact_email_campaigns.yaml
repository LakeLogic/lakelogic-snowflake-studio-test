version: 1.0.0

info:
  title: Gold — Fact Email Campaigns
  target_layer: gold
  description: 'grain: one row per campaign send to a recipient'
  table_name: '{gold_layer}_fact_email_campaigns'
  system: hubspot
  domain: marketing

model:
  fields:
  - name: campaign_id
    type: string
    required: true
    description: Grain key of the 'email_campaigns' fact.
  - name: recipient_email
    type: string
    required: true
    pii: true
    masking: hash
    classification: email
    description: Grain key of the 'email_campaigns' fact.
  - name: sent_at
    type: timestamp
    required: false
    description: Column 'sent_at' of the 'email_campaigns' fact.
  - name: opened_at
    type: timestamp
    required: false
    description: Column 'opened_at' of the 'email_campaigns' fact.
  - name: clicked_at
    type: timestamp
    required: false
    description: Column 'clicked_at' of the 'email_campaigns' fact.
  - name: campaign_name
    type: string
    required: false
    description: Column 'campaign_name' of the 'email_campaigns' fact.
  - name: subject_line
    type: string
    required: false
    description: Column 'subject_line' of the 'email_campaigns' fact.
  - name: bounced
    type: boolean
    required: false
    description: Column 'bounced' of the 'email_campaigns' fact.
  - name: unsubscribed
    type: boolean
    required: false
    description: Column 'unsubscribed' of the 'email_campaigns' fact.
  - name: engagement_stage
    type: string
    required: true
    description: 'Derived from clicked_at by rule: one of clicked, sent.'
  - name: sent_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `sent_at`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_email_campaigns

primary_key:
- campaign_id
- recipient_email

quality:
  row_rules:
  - name: engagement_stage_accepted_values
    sql: engagement_stage IN ('clicked', 'sent')
    category: validity
    description: 'engagement_stage is one of: clicked, sent.'
  dataset_rules:
  - unique:
      columns:
      - campaign_id
      - recipient_email
      name: campaign_id_recipient_email_unique
      category: uniqueness
      description: No two rows share the same campaign_id, recipient_email.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.campaign_id,
      r.recipient_email,
      r.sent_at,
      r.opened_at,
      r.clicked_at,
      r.campaign_name,
      r.subject_line,
      r.bounced,
      r.unsubscribed,
      CASE WHEN r.clicked_at IS NOT NULL THEN 'clicked' ELSE 'sent' END AS engagement_stage,
      CAST(r.sent_at AS DATE) AS sent_date
    FROM source r
- phase: pre
  derive:
    field: system
    sql: '''hubspot'''

materialization:
  fact:
    type: accumulating_snapshot
    milestone_dates:
    - sent_at
    - opened_at
    - clicked_at
  partition_by:
  - sent_date

source:
  type: table
  path: table:{silver_root}.{silver_layer}_hubspot_email_campaigns
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
