version: 1.0.0

info:
  title: Gold — Fact Push Notifications
  target_layer: gold
  description: 'grain: one row per push notification, updated as it moves from sent
    to delivered to opened'
  table_name: '{gold_layer}_fact_push_notifications'
  system: hubspot
  domain: marketing

model:
  fields:
  - name: notification_id
    type: string
    required: true
    description: Grain key of the 'push_notifications' fact.
  - name: sent_at
    type: timestamp
    required: false
    description: Column 'sent_at' of the 'push_notifications' fact.
  - name: delivered_at
    type: timestamp
    required: false
    description: Column 'delivered_at' of the 'push_notifications' fact.
  - name: opened_at
    type: timestamp
    required: false
    description: Column 'opened_at' of the 'push_notifications' fact.
  - name: campaign_name
    type: string
    required: false
    description: Column 'campaign_name' of the 'push_notifications' fact.
  - name: platform
    type: string
    required: false
    description: Column 'platform' of the 'push_notifications' fact.
  - name: rider_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_rider_profiles
      column: rider_profiles_sk
    description: Surrogate key of gold_dim_rider_profiles, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: delivered_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `delivered_at`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_push_notifications

primary_key:
- notification_id

quality:
  dataset_rules:
  - unique:
      columns:
      - notification_id
      name: notification_id_unique
      category: uniqueness
      description: No two rows share the same notification_id.
  - name: rider_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE rider_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose rider_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.notification_id,
      r.sent_at,
      r.delivered_at,
      r.opened_at,
      r.campaign_name,
      r.platform,
      COALESCE(d1.rider_profiles_sk, '-1') AS rider_sk,
      CAST(r.delivered_at AS DATE) AS delivered_date
    FROM source r
    LEFT JOIN gold_dim_rider_profiles d1
      ON  r.rider_id = d1.rider_id
- phase: pre
  derive:
    field: system
    sql: '''hubspot'''

links:
- name: gold_dim_rider_profiles
  type: table
  path: table:{domain_catalog_prefix}_marketplace.{gold_layer}.{gold_layer}_dim_rider_profiles

upstream:
- gold_dim_rider_profiles

materialization:
  fact:
    type: accumulating_snapshot
    milestone_dates:
    - sent_at
    - delivered_at
    - opened_at
  partition_by:
  - delivered_date

source:
  type: table
  path: table:{silver_root}.{silver_layer}_hubspot_push_notifications
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
