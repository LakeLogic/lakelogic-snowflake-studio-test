version: 1.0.0

info:
  title: Bronze — Checkr Driver Verifications
  target_layer: bronze
  table_name: '{bronze_layer}_checkr_driver_verifications'
  domain: operations
  system: checkr

model:
  fields:
  - name: report_id
    type: string
    description: Observed string column ingested from the scanned source operations.checkr.driver_verifications.
  - name: driver_id
    type: string
    description: Observed string column ingested from the scanned source operations.checkr.driver_verifications.
  - name: full_name
    type: string
    pii: true
    classification: person_name
    description: Observed string column ingested from the scanned source operations.checkr.driver_verifications.
      Personal data (person_name), not masked.
  - name: date_of_birth
    type: string
    pii: true
    classification: date_of_birth
    description: Observed string column ingested from the scanned source operations.checkr.driver_verifications.
      Personal data (date_of_birth), not masked.
  - name: ssn_last_four
    type: string
    pii: true
    classification: national_id
    description: Observed string column ingested from the scanned source operations.checkr.driver_verifications.
      Personal data (national_id), not masked.
  - name: licence_number
    type: string
    pii: true
    classification: licence_id
    description: Observed string column ingested from the scanned source operations.checkr.driver_verifications.
      Personal data (licence_id), not masked.
  - name: address
    type: string
    pii: true
    classification: postal_address
    description: Observed string column ingested from the scanned source operations.checkr.driver_verifications.
      Personal data (postal_address), not masked.
  - name: status
    type: string
    description: Observed string column ingested from the scanned source operations.checkr.driver_verifications.
  - name: result
    type: string
    description: Observed string column ingested from the scanned source operations.checkr.driver_verifications.
  - name: completed_at
    type: timestamp
    description: Observed timestamp column ingested from the scanned source operations.checkr.driver_verifications.
  - name: created_at
    type: timestamp
    description: Observed timestamp column ingested from the scanned source operations.checkr.driver_verifications.
  - name: adjudication
    type: string
    description: Observed string column ingested from the scanned source operations.checkr.driver_verifications.

source:
  type: landing
  path: '{landing_root}/driver_verifications'
  format: parquet
  load_mode: full

primary_key:
- report_id

dataset: bronze_checkr_driver_verifications
