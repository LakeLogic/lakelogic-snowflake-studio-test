version: 1.0.0

info:
  title: Gold — Fact Support Tickets
  target_layer: gold
  description: 'grain: one row per support ticket'
  table_name: '{gold_layer}_fact_support_tickets'
  system: zendesk
  domain: operations

model:
  fields:
  - name: ticket_id
    type: string
    required: true
    description: Grain key of the 'support_tickets' fact.
  - name: satisfaction_rating
    type: float
    required: false
    description: 'Measure candidate: avg of ''satisfaction_rating'' (needs confirmation).'
  - name: created_at
    type: timestamp
    required: false
    description: Column 'created_at' of the 'support_tickets' fact.
  - name: solved_at
    type: timestamp
    required: false
    description: Column 'solved_at' of the 'support_tickets' fact.
  - name: trip_id
    type: string
    required: false
    description: Column 'trip_id' of the 'support_tickets' fact.
  - name: charge_id
    type: string
    required: false
    description: Column 'charge_id' of the 'support_tickets' fact.
  - name: status
    type: string
    required: false
    description: Column 'status' of the 'support_tickets' fact.
  - name: priority
    type: string
    required: false
    description: Column 'priority' of the 'support_tickets' fact.
  - name: channel
    type: string
    required: false
    description: Column 'channel' of the 'support_tickets' fact.
  - name: assignee
    type: string
    required: false
    description: Column 'assignee' of the 'support_tickets' fact.
  - name: entry_point
    type: string
    required: false
    description: Column 'entry_point' of the 'support_tickets' fact.
  - name: driver_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_driver_profiles
      column: driver_profiles_sk
    description: Surrogate key of gold_dim_driver_profiles, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: rider_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_rider_profiles
      column: rider_profiles_sk
    description: Surrogate key of gold_dim_rider_profiles, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: created_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `created_at`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_support_tickets

primary_key:
- ticket_id

quality:
  dataset_rules:
  - unique:
      columns:
      - ticket_id
      name: ticket_id_unique
      category: uniqueness
      description: No two rows share the same ticket_id.
  - name: driver_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE driver_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose driver_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: rider_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE rider_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose rider_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.ticket_id,
      r.created_at,
      r.solved_at,
      r.trip_id,
      r.charge_id,
      r.status,
      r.priority,
      r.channel,
      r.assignee,
      r.entry_point,
      r.satisfaction_rating AS satisfaction_rating,
      COALESCE(d1.driver_profiles_sk, '-1') AS driver_sk,
      COALESCE(d2.rider_profiles_sk, '-1') AS rider_sk,
      CAST(r.created_at AS DATE) AS created_date
    FROM source r
    LEFT JOIN gold_dim_driver_profiles d1
      ON  r.driver_id = d1.driver_id
    LEFT JOIN gold_dim_rider_profiles d2
      ON  r.rider_id = d2.rider_id
- phase: pre
  derive:
    field: system
    sql: '''zendesk'''

links:
- name: gold_dim_driver_profiles
  type: table
  path: table:{domain_catalog_prefix}_marketplace.{gold_layer}.{gold_layer}_dim_driver_profiles
- name: gold_dim_rider_profiles
  type: table
  path: table:{domain_catalog_prefix}_marketplace.{gold_layer}.{gold_layer}_dim_rider_profiles

upstream:
- gold_dim_driver_profiles
- gold_dim_rider_profiles

materialization:
  fact:
    type: accumulating_snapshot
    milestone_dates:
    - created_at
    - solved_at
  partition_by:
  - created_date

source:
  type: table
  path: table:{silver_root}.{silver_layer}_zendesk_support_tickets
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
