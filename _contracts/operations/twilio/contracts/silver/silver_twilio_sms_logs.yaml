version: 1.0.0

info:
  title: Silver — Twilio Sms Logs
  target_layer: silver
  table_name: '{silver_layer}_twilio_sms_logs'
  system: twilio
  domain: operations

model:
  fields:
  - name: message_sid
    type: string
    required: true
    description: Business key 'message_sid' (from source table 'sms_logs'), typed
      as string.
  - name: recipient_phone
    type: string
    required: false
    pii: true
    classification: phone
    description: Column 'recipient_phone' projected from source table 'sms_logs',
      typed as string. Personal data (phone), real values here, masked at gold (hash).
  - name: sender_phone
    type: string
    required: false
    pii: true
    classification: phone
    description: Column 'sender_phone' projected from source table 'sms_logs', typed
      as string. Personal data (phone), real values here, masked at gold (hash).
  - name: message_body
    type: string
    required: false
    description: Column 'message_body' projected from source table 'sms_logs', typed
      as string.
  - name: status
    type: string
    required: false
    description: Column 'status' projected from source table 'sms_logs', typed as
      string.
  - name: direction
    type: string
    required: false
    description: Column 'direction' projected from source table 'sms_logs', typed
      as string.
  - name: num_segments
    type: integer
    required: false
    description: Column 'num_segments' projected from source table 'sms_logs', typed
      as integer.
  - name: price
    type: float
    required: false
    description: Column 'price' projected from source table 'sms_logs', typed as float.
  - name: price_unit
    type: float
    required: false
    description: Column 'price_unit' projected from source table 'sms_logs', typed
      as float.
  - name: sent_at
    type: timestamp
    required: false
    description: Column 'sent_at' projected from source table 'sms_logs', typed as
      timestamp.
  - name: delivered_at
    type: timestamp
    required: false
    description: Column 'delivered_at' projected from source table 'sms_logs', typed
      as timestamp.
  - name: error_code
    type: string
    required: false
    description: Column 'error_code' projected from source table 'sms_logs', typed
      as string.
  - name: delivered_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `delivered_at`.'

primary_key:
- message_sid

quality:
  row_rules:
  - name: message_sid_not_null
    sql: message_sid IS NOT NULL
    category: completeness
    description: message_sid is always present (never null).
  - name: message_sid_not_null
    sql: message_sid IS NOT NULL
    category: completeness
    description: message_sid is always present (never null).

transformations:
- phase: pre
  derive:
    field: delivered_date
    sql: CAST(delivered_at AS DATE)
- deduplicate:
    by:
    - message_sid
    sort_by:
    - _lakelogic_processed_at
    order: desc

materialization:
  partition_by:
  - delivered_date

dataset: silver_twilio_sms_logs

source:
  type: table
  path: table:{bronze_root}.{bronze_layer}_twilio_sms_logs
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
